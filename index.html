<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickFlow — Universo de Blocos de Montar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="brick-wall">
    <div class="app-layout">
        <!-- SIDEBAR DE BLOCOS -->
        <aside class="sidebar-brick">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <rect x="4" y="10" width="32" height="24" rx="5" fill="#E53935"/>
                        <circle cx="12" cy="7" r="4" fill="#B71C1C"/>
                        <circle cx="28" cy="7" r="4" fill="#B71C1C"/>
                    </svg>
                </div>
                <h2>BrickFlow</h2>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-btn active" onclick="switchTab('dashboard')">
                    <span class="btn-studs"></span>Visão Geral
                </button>
                <button class="nav-btn" onclick="switchTab('kanban')">
                    <span class="btn-studs"></span>Quadro Kanban
                </button>
            </nav>

            <!-- MINIFIGURA 1: NINJA VERDE DETALHADO -->
            <div class="character-container sidebar-char">
                <svg viewBox="0 0 100 130" width="100" height="130">
                    <!-- Sombra -->
                    <ellipse cx="50" cy="125" rx="35" ry="5" fill="rgba(0,0,0,0.2)"/>
                    <!-- Perfil Cabeça / Máscara Ninja -->
                    <rect x="30" y="20" width="40" height="35" rx="8" fill="#2E7D32"/>
                    <rect x="35" y="30" width="30" height="12" rx="3" fill="#FFE082"/>
                    <!-- Olhos Expressivos -->
                    <circle cx="43" cy="36" r="2.5" fill="#111"/>
                    <circle cx="57" cy="36" r="2.5" fill="#111"/>
                    <path d="M 40 33 L 47 35" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M 60 33 L 53 35" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- Faixa Ninja -->
                    <rect x="30" y="18" width="40" height="6" fill="#1B5E20"/>
                    <!-- Corpo Ninja -->
                    <path d="M 25 55 L 75 55 L 70 92 L 30 92 Z" fill="#1B5E20"/>
                    <path d="M 40 55 L 50 78 L 60 55" stroke="#A5D6A7" stroke-width="3" fill="none"/>
                    <circle cx="50" cy="70" r="4" fill="#FFD54F"/>
                    <!-- Braços Articulados -->
                    <rect x="12" y="56" width="14" height="28" rx="6" fill="#2E7D32" transform="rotate(12 19 70)"/>
                    <rect x="74" y="56" width="14" height="28" rx="6" fill="#2E7D32" transform="rotate(-12 81 70)"/>
                    <!-- Mãos Gancho -->
                    <path d="M 10 82 C 6 82 5 90 12 90 C 16 90 16 85 13 85" stroke="#FFE082" stroke-width="3.5" fill="none"/>
                    <path d="M 90 82 C 94 82 95 90 88 90 C 84 90 84 85 87 85" stroke="#FFE082" stroke-width="3.5" fill="none"/>
                    <!-- Pernas com Encaixes -->
                    <rect x="30" y="92" width="18" height="28" rx="2" fill="#1B5E20"/>
                    <rect x="52" y="92" width="18" height="28" rx="2" fill="#1B5E20"/>
                    <rect x="32" y="112" width="14" height="6" fill="#111"/>
                    <rect x="54" y="112" width="14" height="6" fill="#111"/>
                </svg>
                <div class="speech-bubble">Construa com precisão!</div>
            </div>

            <div class="sidebar-actions">
                <button class="brick-btn btn-secondary" id="themeToggleBtn" onclick="toggleDarkMode()">
                    🌓 Modo Escuro
                </button>
                <button class="brick-btn btn-secondary" onclick="exportDataJSON()">
                    📦 Exportar JSON
                </button>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <!-- CABEÇALHO -->
            <header class="header-brick">
                <div class="welcome-box">
                    <h1>Painel de Construção BrickFlow</h1>
                    <p>Gerencie tarefas como verdadeiras peças de montar.</p>
                </div>
                <button class="brick-btn btn-primary" onclick="openModal()">
                    + Nova Tarefa
                </button>
            </header>

            <!-- STATS / DASHBOARD -->
            <section class="stats-grid">
                <div class="stat-card brick-card yellow">
                    <div class="card-studs"><span></span><span></span><span></span><span></span></div>
                    <h3>Total de Tarefas</h3>
                    <div class="stat-number" id="statTotal">0</div>
                </div>
                <div class="stat-card brick-card red">
                    <div class="card-studs"><span></span><span></span><span></span><span></span></div>
                    <h3>A Fazer</h3>
                    <div class="stat-number" id="statPending">0</div>
                </div>
                <div class="stat-card brick-card blue">
                    <div class="card-studs"><span></span><span></span><span></span><span></span></div>
                    <h3>Em Andamento</h3>
                    <div class="stat-number" id="statProgress">0</div>
                </div>
                <div class="stat-card brick-card green">
                    <div class="card-studs"><span></span><span></span><span></span><span></span></div>
                    <h3>Concluídas</h3>
                    <div class="stat-number" id="statCompleted">0</div>
                </div>
            </section>

            <!-- BARRA DE PROGRESSO EM BLOCOS -->
            <section class="progress-section brick-card">
                <h3>Progresso da Obra</h3>
                <div class="brick-progress-bar">
                    <div class="brick-progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </section>

            <!-- FILTROS E PESQUISA -->
            <section class="filter-section brick-card">
                <div class="filter-group">
                    <input type="text" id="searchInput" placeholder="Buscar por título..." oninput="applyFilters()" class="brick-input">
                    <select id="priorityFilter" onchange="applyFilters()" class="brick-select">
                        <option value="all">Todas as Prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                    </select>
                    <select id="statusFilter" onchange="applyFilters()" class="brick-select">
                        <option value="all">Todos os Status</option>
                        <option value="pendente">A Fazer</option>
                        <option value="andamento">Em Andamento</option>
                        <option value="concluida">Concluída</option>
                    </select>
                    <button class="brick-btn btn-small" onclick="clearFilters()">Limpar Filtros</button>
                </div>
            </section>

            <!-- QUADRO KANBAN 3D COM PERSONAGEM CONSTRUTOR -->
            <div class="kanban-wrapper">
                <div class="character-container kanban-char">
                    <svg viewBox="0 0 100 130" width="80" height="110">
                        <ellipse cx="50" cy="125" rx="30" ry="5" fill="rgba(0,0,0,0.2)"/>
                        <!-- Capacete de Segurança Amarelo -->
                        <path d="M 25 32 C 25 10, 75 10, 75 32 Z" fill="#FBC02D"/>
                        <rect x="20" y="30" width="60" height="5" rx="2" fill="#F57F17"/>
                        <!-- Cabeça Minifigura -->
                        <rect x="30" y="34" width="40" height="25" rx="5" fill="#FFE082"/>
                        <circle cx="42" cy="45" r="2.5" fill="#111"/>
                        <circle cx="58" cy="45" r="2.5" fill="#111"/>
                        <path d="M 44 52 Q 50 56 56 52" stroke="#111" stroke-width="2" fill="none"/>
                        <!-- Colete Refletivo de Construtor -->
                        <path d="M 25 60 L 75 60 L 70 95 L 30 95 Z" fill="#E65100"/>
                        <rect x="35" y="60" width="8" height="35" fill="#FFF"/>
                        <rect x="57" y="60" width="8" height="35" fill="#FFF"/>
                        <!-- Braços e Pernas -->
                        <rect x="14" y="60" width="12" height="26" rx="5" fill="#E65100"/>
                        <rect x="74" y="60" width="12" height="26" rx="5" fill="#E65100"/>
                        <rect x="30" y="95" width="18" height="26" fill="#1565C0"/>
                        <rect x="52" y="95" width="18" height="26" fill="#1565C0"/>
                    </svg>
                </div>

                <section class="kanban-board">
                    <!-- A FAZER -->
                    <div class="kanban-column col-todo" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'pendente')">
                        <div class="column-header red-header">
                            <span class="header-studs"></span>
                            <h2>A Fazer (<span id="countTodo">0</span>)</h2>
                        </div>
                        <div class="task-list" id="listTodo"></div>
                    </div>

                    <!-- EM ANDAMENTO -->
                    <div class="kanban-column col-in-progress" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'andamento')">
                        <div class="column-header blue-header">
                            <span class="header-studs"></span>
                            <h2>Em Andamento (<span id="countProgress">0</span>)</h2>
                        </div>
                        <div class="task-list" id="listProgress"></div>
                    </div>

                    <!-- CONCLUÍDAS -->
                    <div class="kanban-column col-done" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'concluida')">
                        <div class="column-header green-header">
                            <span class="header-studs"></span>
                            <h2>Concluídas (<span id="countDone">0</span>)</h2>
                        </div>
                        <div class="task-list" id="listDone"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL DE CRIAR/EDITAR -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-brick">
            <div class="modal-header">
                <h2 id="modalTitle">Encaixar Nova Tarefa</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Título da Tarefa</label>
                    <input type="text" id="taskTitle" required class="brick-input">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea id="taskDescription" rows="3" class="brick-input"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority" class="brick-select">
                            <option value="baixa">Baixa</option>
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Prazo de Entrega</label>
                        <input type="date" id="taskDueDate" required class="brick-input">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="brick-btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="brick-btn btn-primary">Salvar Peça</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
